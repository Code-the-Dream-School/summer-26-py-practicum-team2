name: Python Quality Gates

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

jobs:
  python-smoke-check:
    name: Python smoke check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall services

  pipeline-tests:
    name: Pipeline tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cityair
          POSTGRES_PASSWORD: cityair
          POSTGRES_DB: cityair
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cityair -d cityair"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql+psycopg://cityair:cityair@localhost:5432/cityair
        working-directory: services/pipeline
        run: python -m alembic upgrade head

      - name: Run pipeline tests
        env:
          PYTHONPATH: services/pipeline
          DATABASE_URL: postgresql+psycopg://cityair:cityair@localhost:5432/cityair
        run: python -m pytest services/pipeline/tests
